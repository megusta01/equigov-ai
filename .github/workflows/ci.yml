name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PLUGIN: wordpress/plugins/equigov-core
  AI_SERVICE_TOKEN: ci-token-0123456789abcdef

jobs:
  php:
    name: PHP · lint e testes unitários
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
          coverage: none
      - name: Instalar dependências
        working-directory: ${{ env.PLUGIN }}
        run: composer install --no-interaction --no-progress
      - name: Lint (php -l)
        working-directory: ${{ env.PLUGIN }}
        run: find src equigov-core.php -name '*.php' -print0 | xargs -0 -n1 php -l > /dev/null
      - name: PHPUnit
        working-directory: ${{ env.PLUGIN }}
        run: vendor/bin/phpunit --testdox

  ai-service:
    name: Python · lint e testes do serviço de IA
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Ruff
        run: ruff check app tests && ruff format --check app tests
      - name: Pytest
        run: python -m pytest

  integration:
    name: Integração · WordPress + MariaDB + IA + navegador
    runs-on: ubuntu-latest
    needs: [php, ai-service]
    services:
      db:
        image: mariadb:11.4
        env:
          MARIADB_DATABASE: equigov
          MARIADB_USER: equigov
          MARIADB_PASSWORD: equigov
          MARIADB_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mysqli
          tools: wp-cli
          coverage: none
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-service/requirements*.txt

      - name: Serviço de IA (LLM fake, acervo de teste)
        working-directory: ai-service
        env:
          DATA_DIR: ${{ runner.temp }}/ai-data
          LLM_PROVIDER: fake
          RETRIEVAL_MODE: bm25
        run: |
          pip install -r requirements.txt
          python -m app.cli ingest tests/fixtures/corpus
          nohup uvicorn --factory app.main:app_factory --port 8001 > ${{ runner.temp }}/ai.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8001/health && break; sleep 1; done

      - name: WordPress
        env:
          WP: ${{ runner.temp }}/wp
        run: |
          wp core download --path="$WP" --locale=pt_BR --quiet
          wp config create --path="$WP" --dbname=equigov --dbuser=equigov --dbpass=equigov --dbhost=127.0.0.1 --skip-check --quiet
          wp config set --path="$WP" WP_ENVIRONMENT_TYPE local --quiet
          wp config set --path="$WP" EQUIGOV_AI_SERVICE_URL http://127.0.0.1:8001 --quiet
          wp config set --path="$WP" EQUIGOV_AI_SERVICE_TOKEN "$AI_SERVICE_TOKEN" --quiet
          wp core install --path="$WP" --url=http://localhost:8080 --title=EquiGov --admin_user=admin --admin_password=admin --admin_email=ci@equigov.local --skip-email --quiet
          ln -s "$GITHUB_WORKSPACE/$PLUGIN" "$WP/wp-content/plugins/equigov-core"
          wp plugin activate equigov-core --path="$WP"
          wp equigov seed --path="$WP"

      - name: Smoke · API de diagnóstico
        run: wp eval-file "$PLUGIN/tests/smoke/api-smoke.php" --path=${{ runner.temp }}/wp
      - name: Smoke · fluxo do plano de ação
        run: wp eval-file "$PLUGIN/tests/smoke/plan-smoke.php" --path=${{ runner.temp }}/wp

      - name: E2E no navegador (Playwright)
        env:
          BASE_URL: http://localhost:8080
          SHOTS_DIR: ${{ runner.temp }}/e2e-screenshots
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          (cd ${{ runner.temp }}/wp && nohup php -S localhost:8080 > ${{ runner.temp }}/php.log 2>&1 &)
          sleep 2
          python "$PLUGIN/tests/e2e/admin_flow.py"

      - name: Capturas de tela do E2E
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e-screenshots
          if-no-files-found: ignore
      - name: Logs em caso de falha
        if: failure()
        run: tail -n 80 ${{ runner.temp }}/ai.log ${{ runner.temp }}/php.log || true

  security:
    name: Segurança · segredos e dependências
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Segredos no histórico (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer:v2
      - name: Vulnerabilidades em dependências PHP
        working-directory: ${{ env.PLUGIN }}
        run: composer install --no-interaction --no-progress && composer audit
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vulnerabilidades em dependências Python
        run: pip install pip-audit && pip-audit -r ai-service/requirements.txt

  docker:
    name: Build das imagens
    runs-on: ubuntu-latest
    needs: [php, ai-service]
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet
      - run: docker compose build
