[project]
name = "equigov-ai-service"
version = "0.1.0"
description = "Serviço de IA do EquiGov: ingestão, busca híbrida e planos de ação fundamentados"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]  # assert em testes; Depends/File em defaults é o idioma do FastAPI

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S105", "S106"]
