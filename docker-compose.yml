name: equigov

services:
  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME}
      MARIADB_USER: ${DB_USER}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

  wordpress:
    build:
      context: ./infrastructure/php
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: ${DB_NAME}
      WORDPRESS_DB_USER: ${DB_USER}
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD}
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_ENVIRONMENT_TYPE', '${WP_ENV}');
        define('WP_DEBUG', ${WP_DEBUG});
        define('WP_DEBUG_LOG', '/var/log/wordpress/debug.log');
        define('WP_DEBUG_DISPLAY', false);
        define('DISALLOW_FILE_EDIT', true);
        define('EQUIGOV_AI_SERVICE_URL', '${AI_SERVICE_URL}');
    volumes:
      - wp_data:/var/www/html
      - wp_logs:/var/log/wordpress
      - ./wordpress/plugins/equigov-core:/var/www/html/wp-content/plugins/equigov-core
      - ./infrastructure/scripts:/scripts:ro
    networks: [backend]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [wordpress]
    ports:
      - "${HTTP_PORT}:80"
    volumes:
      - wp_data:/var/www/html:ro
      - ./wordpress/plugins/equigov-core:/var/www/html/wp-content/plugins/equigov-core:ro
      - ./infrastructure/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks: [backend]

volumes:
  db_data:
  wp_data:
  wp_logs:

networks:
  backend:
